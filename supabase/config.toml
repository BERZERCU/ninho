[functions.delete-account]\nverify_jwt = false\n

# Local Auth email templates. Hosted Supabase templates are configured in
# Authentication > Email Templates; these files are kept as the source of truth.
[auth.email.template.confirmation]
subject = "Confirme seu e-mail no Ninho"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Redefina sua senha do Ninho"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirme seu novo e-mail no Ninho"
content_path = "./supabase/templates/email_change.html"

[auth.email.notification.password_changed]
enabled = true
subject = "Sua senha do Ninho foi alterada"
content_path = "./supabase/templates/password_changed_notification.html"
