name: Ninho QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: JavaScript syntax
        run: |
          node --check js/app.js
          node --check js/children.js
          node --check js/cloud.js
          node --check js/config.js
          node --check js/captcha.js
          node --check js/captcha-auth.js
          node --check js/features.js
          node --check js/push.js
          node --check sw.js

      - name: Managed child account security
        run: node --test tests/children.test.cjs

      - name: Web Push behavior
        run: node --test tests/push.test.cjs

      - name: Backup encryption and integrity
        run: |
          python3 -m pip install -r scripts/requirements-backup.txt
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: JSON syntax
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"

      - name: Production dependency pin
        run: |
          grep -Fq 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2' index.html
